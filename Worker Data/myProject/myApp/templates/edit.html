{% extends "base.html" %}
{% block title %}
    <title>แบบฟอร์มบันทึกข้อมูล</title>
{% endblock %}
{% block content %}
<div class="container mt-3">
    <h2 class="text-center">แบบฟอร์มบันทึกข้อมูล</h2>
    <form method="POST" action="">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label for="name">ข้อมูลชื่อ</label>
            <input type="text" name="name" class="form-control" value="{{ person.name }}">
        </div>
            <div class="form-group mb-3">
                <label for="age">ข้อมูลอายุ</label>
                <input type="text" name="age" class="form-control" value="{{ person.age }}">
            </div>
        <button type="submit" value="บันทึกข้อมูล" class="btn btn-success mt-3">บันทึกข้อมูล</button>
    </form>
</div>
{% endblock %}
